<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hartley Estate — Estate Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#f5f0e8;--ink:#2a2010;--cyan:#2a9d8f;}
html,body{height:100%;overflow:hidden;background:#1a1610}
body{font-family:'Cormorant Garamond',serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:0.85rem 2rem;border-bottom:0.5px solid rgba(245,240,232,0.12);background:rgba(26,22,16,0.96);backdrop-filter:blur(8px);flex-shrink:0;z-index:20}
.h-left{display:flex;align-items:center;gap:1.25rem}
.h-logo svg{height:34px;width:auto}
.h-meta{display:flex;flex-direction:column;gap:2px}
.h-title{font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#f5f0e8}
.h-sub{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,240,232,0.35)}
.chip{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.13em;text-transform:uppercase;padding:5px 12px;border-radius:2px;background:rgba(42,157,143,0.1);color:#2a9d8f;border:0.5px solid rgba(42,157,143,0.28)}
.dot{width:5px;height:5px;border-radius:50%;background:#2a9d8f;animation:p 2.5s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:0.25}}
.htime{font-family:'DM Mono',monospace;font-size:8px;color:rgba(245,240,232,0.32);letter-spacing:0.06em}

main{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#1a1610}

.aerial-wrap{
  position:relative;
  height:calc(100vh - 62px);
  display:flex;align-items:center;justify-content:center;
}
.aerial-img{
  height:100%;width:auto;display:block;object-fit:contain;
}

/* Zone hit areas — invisible, sit over image */
.zone-hit{
  position:absolute;
  cursor:pointer;
  border-radius:50%;
  background:transparent;
  transition:background 0.2s;
}
.zone-hit:hover{background:rgba(42,157,143,0.12);outline:1px solid rgba(42,157,143,0.25)}

/* Marker icon — small pulsing dot, sits inside the zone */
.marker{
  position:absolute;
  width:20px;height:20px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.marker-inner{
  width:8px;height:8px;border-radius:50%;
  background:rgba(245,240,232,0.9);
  box-shadow:0 0 0 3px rgba(245,240,232,0.25);
}
.marker-ring{
  position:absolute;
  width:20px;height:20px;border-radius:50%;
  border:1px solid rgba(245,240,232,0.35);
  animation:ring 2.5s ease-out infinite;
}
@keyframes ring{
  0%{transform:scale(0.5);opacity:0.6}
  100%{transform:scale(1.4);opacity:0}
}
/* Birdbox marker — cyan accent */
.marker.cam .marker-inner{background:#2a9d8f;box-shadow:0 0 0 3px rgba(42,157,143,0.25)}
.marker.cam .marker-ring{border-color:rgba(42,157,143,0.5)}

/* Tooltip */
.tip{position:fixed;background:rgba(20,16,10,0.97);border:0.5px solid rgba(245,240,232,0.12);border-radius:3px;padding:14px 18px;min-width:200px;max-width:255px;box-shadow:0 8px 40px rgba(0,0,0,0.6);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity 0.15s,transform 0.15s;z-index:100}
.tip.show{opacity:1;transform:translateY(0)}
.tip-zone{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(245,240,232,0.35);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.tip-zone::before{content:'';display:block;width:14px;height:0.5px;background:currentColor}
.tip-name{font-size:17px;font-weight:600;line-height:1.1;margin-bottom:5px;color:#f5f0e8}
.tip-desc{font-size:11.5px;color:rgba(245,240,232,0.52);line-height:1.6;margin-bottom:9px}
.tip-stat{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:0.14em;text-transform:uppercase;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:1px;width:fit-content;background:rgba(42,157,143,0.1);color:#2a9d8f;border:0.5px solid rgba(42,157,143,0.22)}
.tip-sd{width:4px;height:4px;border-radius:50%;background:currentColor}

.cam-btn{position:fixed;bottom:4.5rem;right:1.5rem;display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:3px;background:rgba(20,16,10,0.96);color:#f5f0e8;font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.15em;text-transform:uppercase;text-decoration:none;z-index:50;box-shadow:0 4px 24px rgba(0,0,0,0.5);border:0.5px solid rgba(245,240,232,0.12);transition:all 0.18s;cursor:pointer}
.cam-btn:hover{background:#2a2010;border-color:rgba(42,157,143,0.4)}
/* Video modal */
.cam-modal{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px)}
.cam-modal.open{display:flex}
.cam-modal-inner{position:relative;width:min(720px,92vw);background:#0a0806;border:0.5px solid rgba(245,240,232,0.12);border-radius:4px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.7)}
.cam-modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid rgba(245,240,232,0.08)}
.cam-modal-title{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(245,240,232,0.5);display:flex;align-items:center;gap:8px}
.cam-modal-live{width:5px;height:5px;border-radius:50%;background:#d44;animation:p 1.4s ease-in-out infinite}
.cam-modal-close{background:none;border:none;color:rgba(245,240,232,0.4);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;transition:color 0.15s}
.cam-modal-close:hover{color:#f5f0e8}
.cam-modal-video{position:relative;padding-bottom:56.25%;height:0}
.cam-modal-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.cam-modal-note{padding:10px 16px;font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.12em;color:rgba(245,240,232,0.28);text-transform:uppercase}
.cam-live{width:5px;height:5px;border-radius:50%;background:#d44;animation:p 1.4s ease-in-out infinite}

nav.ges-hub-nav{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);display:inline-flex;align-items:stretch;background:rgba(20,16,10,0.96);backdrop-filter:blur(14px);border:0.5px solid rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;z-index:999;box-shadow:0 4px 24px rgba(0,0,0,0.5);font-family:'DM Mono',monospace;white-space:nowrap;max-width:calc(100vw - 2rem)}
nav.ges-hub-nav a{display:flex;align-items:center;gap:6px;padding:9px 15px;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,240,232,0.35);text-decoration:none;border-right:0.5px solid rgba(255,255,255,0.05);transition:color 0.15s,background 0.15s;line-height:1}
nav.ges-hub-nav a:last-child{border-right:none}
nav.ges-hub-nav a:hover{color:rgba(245,240,232,0.9);background:rgba(255,255,255,0.03)}
nav.ges-hub-nav a.active{color:#2a9d8f}
nav.ges-hub-nav a.hub{color:#2a9d8f!important;border-right:0.5px solid rgba(255,255,255,0.08)!important}
.nd{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0}
</style>
</head>

    <!-- Orchard -->
    <div class="zone-hit" data-zone="orchard" data-cx="85" data-cy="88" data-w="14" data-h="12"></div>

<script>
function tick(){
  const n=new Date();
  document.getElementById('htime').textContent=
    n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · '+n.toLocaleTimeString('en-GB');
}
tick();setInterval(tick,1000);

// Position zones and markers relative to the rendered image
const img = document.getElementById('aimg');
const wrap = document.getElementById('awrap');

function layout(){
  const r = img.getBoundingClientRect();
  const wr = wrap.getBoundingClientRect();
  const offX = r.left - wr.left;
  const offY = r.top - wr.top;
  const W = r.width, H = r.height;

  document.querySelectorAll('[data-cx]').forEach(el=>{
    const cx = parseFloat(el.dataset.cx)/100;
    const cy = parseFloat(el.dataset.cy)/100;
    const left = offX + cx*W;
    const top  = offY + cy*H;

    if(el.classList.contains('zone-hit')){
      const w = parseFloat(el.dataset.w)/100 * W;
      const h = parseFloat(el.dataset.h)/100 * H;
      el.style.cssText = `left:${left - w/2}px;top:${top - h/2}px;width:${w}px;height:${h}px;border-radius:${Math.min(w,h)*0.35}px`;
    } else {
      el.style.cssText = `left:${left}px;top:${top}px`;
    }
  });
}

img.addEventListener('load', layout);
window.addEventListener('resize', layout);
if(img.complete) layout();

// Tooltip data
const Z={
  pool:{z:'Pool & Terrace',n:'Pool & Terrace',d:'Heated swimming pool with surrounding limestone terrace. Automatic cover active. Water temperature 28°C. Filter running normally.',s:'Pool temp 28°C · Cover closed'},
  vegplot:{z:'Productive Zone',n:'Kitchen Garden',d:'16 raised beds. Currently growing: courgettes, runner beans, salad leaves, tomatoes, beetroot. Harvest due in approximately 10 days.',s:'Ready to harvest soon'},
  chickens:{z:'Livestock',n:'Chicken Enclosure',d:'8 hens. Automatic door active — opens at dawn, closes at dusk. Water and feed topped Tuesday. 6 eggs collected this morning.',s:'6 eggs today'},
  pond:{z:'Water Feature',n:'The Pond',d:'0.15 acre natural pond. pH 7.2 · Temp 14°C · Pump running. Kingfisher sighting logged Tuesday. Wildlife camera active.',s:'Water quality excellent'},
  birdbox:{z:'Live Camera',n:'Oak Tree Birdbox',d:'Camera-equipped birdbox in the old oak. Occupied by a pair of blue tits — five chicks hatched this week. Live feed available below.',s:'Occupied · 5 chicks present'},
  wildlife:{z:'Conservation Zone',n:'Wildflower Meadow',d:'0.2 acres of rewilded native wildflower mix. Bee count up 40% this season. Ox-eye daisy, cornflower, poppy and knapweed in bloom.',s:'Thriving · No action needed'},
  lawn:{z:'Formal Garden',n:'South Lawn',d:'0.4 acres of managed lawn. Automated irrigation active. Last mow 4 days ago. Soil moisture optimal. Mowing scheduled Friday.',s:'Healthy · Irrigated'},
  orchard:{z:'Fruit Production',n:'The Orchard',d:'12 trees — 4 apple, 3 pear, 2 plum, 2 cherry, 1 quince. Strong fruit set this season. No disease or pest markers detected.',s:'Good fruit set'}
};

const tip=document.getElementById('tip');

function show(k,e){
  const z=Z[k];if(!z)return;
  document.getElementById('tip-zone').textContent=z.z;
  document.getElementById('tip-name').textContent=z.n;
  document.getElementById('tip-desc').textContent=z.d;
  document.getElementById('tip-stat-txt').textContent=z.s;
  tip.classList.add('show');move(e);
  if(k==='birdbox') document.getElementById('cam-link').style.borderColor='rgba(42,157,143,0.5)';
}
function hide(){
  tip.classList.remove('show');
  document.getElementById('cam-link').style.borderColor='rgba(245,240,232,0.12)';
}
function move(e){
  const x=e.clientX+18,y=e.clientY-12;
  const tw=tip.offsetWidth||220,th=tip.offsetHeight||130;
  tip.style.left=Math.min(x,window.innerWidth-tw-12)+'px';
  tip.style.top=Math.max(8,Math.min(y,window.innerHeight-th-12))+'px';
}
document.querySelectorAll('.zone-hit').forEach(el=>{
  const k=el.dataset.zone;
  el.addEventListener('mouseenter',e=>show(k,e));
  el.addEventListener('mousemove',move);
  el.addEventListener('mouseleave',hide);
});

function closeModal(){
  document.getElementById('camModal').classList.remove('open');
  // Reset iframe to stop video
  const f=document.getElementById('camFrame');
  f.src=f.src;
}
</script>
</body>
